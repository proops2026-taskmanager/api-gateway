name: PR Open — App CI
on:
  pull_request:
    paths-ignore:
      - 'iac/**'
      - '**/Jenkinsfile'
    branches: [main]
    types: [opened, synchronize]

jobs:
  app-ci:
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v3.1
    with:
      runtime-version: "20"
      project-name: "proops2026-taskmanager"
      service-name: "api-gateway"
      image-tag: ${{ github.sha }}
      push-image: false                # PR open = build, don't push
      service-port: "8080"
      extra-env: |
        JWT_SECRET=test_secret_minimum_32_characters_long
        USER_SERVICE_URL=http://localhost:3001
        TASK_SERVICE_URL=http://localhost:3002
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

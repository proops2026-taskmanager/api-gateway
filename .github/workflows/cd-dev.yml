name: CD — DEV

# Trigger: push to develop (feature/* merged here via PR).
# Pipeline: test + build image → create GHCR pull secret → deploy DEV cluster.
#
# Tests mock upstream services (user-service, task-service) using local Express
# servers — no database containers needed.
#
# Required GitHub repo settings:
#   Secrets:   KUBE_CONFIG_DATA = kubeconfig for taskmanager-dev EKS cluster
#              GHCR_PAT        = GitHub PAT with read:packages (for imagePullSecret on EKS)
#   Variables: DEV_BASE_URL    = http://<api-gateway-elb-hostname>
#
# MINIKUBE MODE: setup-registry, deploy, smoke run on self-hosted (Mac).
# Revert those three jobs to ubuntu-latest + DEV_BASE_URL when back on EKS.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '*.md'

concurrency:
  group: cd-dev-gateway
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/proops2026-taskmanager/api-gateway:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup-registry:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create/update GHCR imagePullSecret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.repository_owner }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            -n default \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Patch api-gateway deployment to use pull secret
        run: |
          kubectl patch deployment api-gateway -n default \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}}}}'

  deploy:
    needs: [build, setup-registry]
    uses: chau11ece/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3
    secrets:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: default
      project-name: "proops2026-taskmanager"
      service-name: "api-gateway"
      runner: ubuntu-latest

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify api-gateway health via ELB
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ vars.DEV_BASE_URL }}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "api-gateway healthy" && exit 0
            echo "Attempt ${i}/12 -> ${STATUS}. Waiting 10s..."
            sleep 10
          done
          echo "api-gateway unreachable after 120s" && exit 1
